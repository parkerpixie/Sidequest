name: Validate Sidequest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/sidequest-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print(f'Found {len(scripts)} inline script block(s).')
          PY
          node --check /tmp/sidequest-inline.js
      - name: Check required app sections
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = ['id="today"','id="feel"','id="pack"','id="wall"','id="boost"','id="settings"','id="weatherHome"','id="homeRoux"']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing required sections: ' + ', '.join(missing))
          print('Required sections present.')
          PY
